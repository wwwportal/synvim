name: synvim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: synvim-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  config-verification:
    name: Verify Neovim Configuration & Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Run Installer Script
        run: |
          ./setup.sh

      - name: Verify Neovim Startup & Core Commands
        run: |
          nvim --headless -c "Synvim help" -c "Tasks" -c "Reindex" -c "qall"
          echo "synvim configuration verified successfully"
